<!doctype html>
<html lang="en">
  <head>

    <!-- JSON-LD Schema Markup for Search Algorithms -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "NT WebUX",
      "url": "https://ntwebux.com",
      "logo": "https://ntwebux.com/nt-favicon.png",
      "image": "https://ntwebux.com/opengraph.jpg",
      "description": "Custom web application architecture, user experience design, and automated business workflows for service-based businesses.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Montreal",
        "addressRegion": "QC",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "45.5017",
        "longitude": "-73.5673"
      },
      "sameAs": [
        "https://www.linkedin.com/company/nt-digital-group"
      ],
      "priceRange": "$"
    }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & description (overridden per-page by react-helmet-async) -->
    <title>NT Web UX | High-Performance Web Apps & Revenue Engines</title>
    <meta name="description" content="We engineer custom web applications, SaaS platforms, and automated revenue engines for scaling businesses in Canada, USA and Worldwide. Bâtissons votre infrastructure numérique." />
    <link rel="canonical" href="https://ntwebux.com/" />

    <!-- OpenGraph — LinkedIn, WhatsApp, X previews -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://ntwebux.com/" />
    <meta property="og:title"        content="NT Digital Group | The Global Operating System for Service Businesses" />
    <meta property="og:description"  content="Technical architecture and AI automation for borderless enterprises. We engineer the digital foundations for high-performance service businesses in Montreal and beyond." />
    <meta property="og:image"        content="https://ntwebux.com/opengraph.jpg?v=3" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="NT Digital Group — Digital Architecture & AI Automation" />
    <meta property="og:locale"       content="en_CA" />
    <meta property="og:site_name"    content="NT Digital Group" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="NT Digital Group | The Global Operating System for Service Businesses" />
    <meta name="twitter:description" content="Technical architecture and AI automation for borderless enterprises. We engineer the digital foundations for high-performance service businesses in Montreal and beyond." />
    <meta name="twitter:image"       content="https://ntwebux.com/opengraph.jpg?v=3" />

    <!-- Additional SEO signals -->
    <meta name="robots"   content="index, follow" />
    <meta name="author"   content="NT Digital Group" />
    <meta name="keywords" content="AI automation, web design, digital architecture, enterprise SaaS, AI operating system, Montreal, bilingual, React" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/nt-favicon.png" />
    <link rel="apple-touch-icon" href="/nt-favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
